
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Coordinador - Saber Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #eef2f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            color: #003366;
            margin-top: 40px;
            position: relative;
        }

        h2::after {
            content: "";
            display: block;
            width: 120px;
            height: 3px;
            background-color: #003366;
            margin: 10px auto 20px;
            border-radius: 5px;
        }

        form {
            background: white;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 650px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px 40px; /* más espacio horizontal */
        }

        input {
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #003366;
            box-shadow: 0 0 5px rgba(0,51,102,0.3);
        }

        .acciones {
            grid-column: span 2;
            text-align: center;
            margin-top: 15px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin: 0 10px;
            width: 160px;
            transition: 0.3s;
        }

        button.guardar {
            background-color: #003366;
        }

        button.guardar:hover {
            background-color: #0055aa;
        }

        button.cancelar {
            background-color: #d9534f;
        }

        button.cancelar:hover {
            background-color: #c9302c;
        }

        .link-lista {
            margin-top: 25px;
            text-align: center;
        }

        .link-lista a {
            color: #003366;
            text-decoration: none;
            font-weight: bold;
        }

        .link-lista a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>Registrar Coordinador</h2>

    <form th:action="@{/admin/guardar-coordinador}" th:object="${usuario}" method="post">
        <input type="hidden" th:value="'COORDINADOR'" th:field="*{rol}" />

        <input type="text" th:field="*{documento}" placeholder="Número de Documento" required>
        <input type="text" th:field="*{telefono}" placeholder="Número Telefónico" required>

        <input type="text" th:field="*{primerApellido}" placeholder="Primer Apellido" required>
        <input type="text" th:field="*{segundoApellido}" placeholder="Segundo Apellido">

        <input type="text" th:field="*{primerNombre}" placeholder="Primer Nombre" required>
        <input type="text" th:field="*{segundoNombre}" placeholder="Segundo Nombre">

        <input type="email" th:field="*{correo}" placeholder="Correo electrónico" required>
        <input type="password" th:field="*{password}" placeholder="Contraseña" required>

        <div class="acciones">
            <button type="submit" class="guardar">Guardar</button>
            <button type="button" class="cancelar" onclick="window.location.href='/admin/inicio'">Cancelar</button>
        </div>
    </form>

    <div class="link-lista">
        <a href="/admin/listar-coordinadores">↩ Ir a la lista</a>
    </div>
</body>
</html>
